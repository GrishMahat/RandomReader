<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Reader Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      color-scheme: light dark;
    }
    /* Pre-paint / overscroll backdrop follows the OS theme until the app syncs its own */
    @media (prefers-color-scheme: dark) {
      html, body { background: #131315; }
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #f7f7f5; }
    }
  </style>
</head>
<body>
  <random-reader-options></random-reader-options>
  <script type="module" src="./main.ts"></script>
</body>
</html>
