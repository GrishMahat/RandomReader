name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Chrome
        run: pnpm build

      - name: Package Chrome zip
        working-directory: dist
        run: zip -r ../random-reader-chrome.zip . -x "*.map"

      - name: Build for Firefox
        run: pnpm build:firefox

      - name: Package Firefox zip
        working-directory: dist-firefox
        run: zip -r ../random-reader-firefox.zip . -x "*.map"

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          notes=$(awk -v tag="${GITHUB_REF#refs/tags/}" '
            /^## / {
              if (found) exit
              if ($0 ~ "^## " tag "([[:space:]]|$)") found = 1
              next
            }
            found { print }
          ' CHANGELOG.md)
          notes="${notes//'%'/'%25'}"
          notes="${notes//$'\n'/'%0A'}"
          notes="${notes//$'\r'/'%0D'}"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Random Reader ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            random-reader-chrome.zip
            random-reader-firefox.zip
