name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome
        run: pnpm run build

      - name: Build Firefox
        run: pnpm run build:firefox

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-reader-chrome
          path: release/random-reader-chrome.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-reader-firefox
          path: release/random-reader-firefox.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/random-reader-chrome/random-reader-chrome.zip
            artifacts/random-reader-firefox/random-reader-firefox.zip
          generate_release_notes: true